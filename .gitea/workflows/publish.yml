name: Publish to PyPI

# Triggered on tag push (vX.Y.Z). Tag-on-push instead of release-creation
# is the cheaper UX — `git tag v0.1.0 && git push origin v0.1.0` ships
# without leaving the terminal.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

# Post-2026-05-06 (Molecule-AI GitHub org suspension): PyPI's Trusted
# Publisher OIDC flow only accepts GitHub/GitLab/Google/ActiveState
# issuers — not Gitea. This workflow uses a long-lived PyPI API token.
#
# KMS migration: PYPI_TOKEN is now sourced at runtime from the Infisical
# SSOT (prod /ci/pypi) via the INFISICAL_CI_* machine identity in the
# "Fetch PYPI_TOKEN from Infisical KMS" step of the publish job, instead of
# the repo-level Gitea Actions secret. The Gitea PYPI_TOKEN secret is
# retained until a green run proves the fetch, then deleted.
permissions:
  contents: read

# Serialize tag-driven publishes so two concurrent tag pushes don't both
# try to upload the same version and race PyPI.
concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match pyproject version $pkg — aborting publish to keep PyPI in sync with git tags"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Smoke-import the built wheel
        run: |
          python -m venv /tmp/install-test
          /tmp/install-test/bin/pip install dist/*.whl
          /tmp/install-test/bin/codex-channel-molecule --help

      - name: Verify package metadata (twine check)
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v3 # pinned to v3 for Gitea act_runner v0.6 compatibility (internal#46)
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3 # pinned to v3 for Gitea act_runner v0.6 compatibility (internal#46)
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # KMS migration (Gitea-Actions-secrets -> Infisical SSOT): source
      # PYPI_TOKEN from Infisical (prod /ci/pypi) via the INFISICAL_CI_*
      # machine identity instead of the repo-level Gitea Actions secret,
      # mirroring the proven molecule-core/molecule-controlplane KMS pattern
      # (#971 / #3274). Exported to $GITHUB_ENV (masked) so the publish step
      # below reads it as an env var. The Gitea PYPI_TOKEN secret is retained
      # until a real green run proves this fetch (validate-before-delete).
      #
      # TRUSTED-REF: this workflow only triggers on `push: tags` (vX.Y.Z),
      # which fork PRs cannot reach — so consuming the INFISICAL_CI_* identity
      # here is safe (no untrusted-fork exposure).
      - name: Fetch PYPI_TOKEN from Infisical KMS
        id: pypi_token
        env:
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
        run: |
          set -uo pipefail
          BASE="https://key.moleculesai.app"
          TOK=$(curl -fsS -X POST "$BASE/api/v1/auth/universal-auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$INFISICAL_CI_CLIENT_ID\",\"clientSecret\":\"$INFISICAL_CI_CLIENT_SECRET\"}" \
            | python3 -c 'import sys,json; v=json.load(sys.stdin).get("accessToken"); sys.stdout.write(v if isinstance(v,str) else "")')
          if [ -z "$TOK" ]; then echo "::error::Infisical accessToken empty - failing closed"; exit 1; fi
          read_secret() {
            curl -fsS "$BASE/api/v3/secrets/raw/$1?workspaceId=$INFISICAL_PROJECT_ID&environment=prod&secretPath=$2" \
              -H "Authorization: Bearer $TOK" \
              | python3 -c 'import sys,json; v=json.load(sys.stdin).get("secret",{}).get("secretValue"); sys.stdout.write(v if isinstance(v,str) else "")'
          }
          PYPI_TOKEN=$(read_secret PYPI_TOKEN %2Fci%2Fpypi)
          echo "::add-mask::$PYPI_TOKEN"
          # Masking-control: assert NON-EMPTY and FAIL LOUD.
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::Infisical returned empty PYPI_TOKEN at prod /ci/pypi — failing closed."
            exit 1
          fi
          echo "PYPI_TOKEN=$PYPI_TOKEN" >> "$GITHUB_ENV"
          echo "PYPI_TOKEN loaded from Infisical (len=${#PYPI_TOKEN})"

      - name: Publish to PyPI
        # PYPI_TOKEN now arrives via $GITHUB_ENV from the "Fetch PYPI_TOKEN
        # from Infisical KMS" step above (Infisical SSOT: prod /ci/pypi),
        # replacing the repo-level Gitea Actions secret. The Gitea secret is
        # retained until this fetch is proven by a green run, then deleted.
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::PYPI_TOKEN is empty. Expected it from the 'Fetch PYPI_TOKEN from Infisical KMS' step (prod /ci/pypi)."
            exit 1
          fi
          python -m pip install --upgrade twine
          python -m twine upload \
            --repository pypi \
            --username __token__ \
            --password "$PYPI_TOKEN" \
            dist/*
