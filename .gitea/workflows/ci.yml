name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install private runtime and test dependencies
        run: |
          set -eu
          python -m pip install --upgrade pip
          RUNTIME_WHEEL="$(mktemp -d)"
          trap 'rm -rf "$RUNTIME_WHEEL"' EXIT
          python -m pip download --no-deps --dest "$RUNTIME_WHEEL" \
            --index-url https://git.moleculesai.app/api/packages/molecule-ai/pypi/simple/ \
            molecules-workspace-runtime==0.4.4
          python -m pip install --index-url https://pypi.org/simple/ \
            "$RUNTIME_WHEEL"/molecules_workspace_runtime-*.whl \
            pytest pytest-asyncio
          python -m pip install --no-deps -e .
      - name: Run tests
        run: pytest -q
